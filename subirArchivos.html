<!DOCTYPE html>
<html lang="es" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subir fotos y videos</title>
  <link rel="stylesheet" href="subirArchivo.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body >
  <section id="upload-section">
    <div class="overlay-upload"></div>

    <div class="upload-container">
      <h1 class="titulo-upload">Sube tus fotos o videos</h1>
      <p class="descripcion-upload">Puedes subir hasta 10 archivos pueden ser imagenes o videos.</p>

      <form id="uploadForm">
        <label for="fileInput" class="file-label">
          Seleccionar Archivos
        </label>
        <input type="file" id="fileInput" name="files" multiple required />
        <br><br>
        <button type="submit" id="boton-upload" class="boton-upload">Subir Archivos</button>
      </form>
      <p id="fileName" class="fileName"></p>

      <div id="progressContainer" style="display: none;">
        <div id="progressBar"></div>
      </div>

      <p id="statusMessage"></p>
    </div>
  </section>
  

  <!-- Modal de confirmación -->
  <div id="modalConfirm" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Archivos subidos correctamente</h2>
      <p id="modalMessage"></p>
      <button id="modalClose">Aceptar</button>
    </div>
  </div>
<!-- PIE DE PÁGINA -->

</body>

</html>
